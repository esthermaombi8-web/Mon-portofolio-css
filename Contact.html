    <main>
        <h1>Me contacter</h1>
        <p>Si vous avez un projet à realiser n' hesitez pas à me contacter</p>
        <form>
            <div>
                <label for="nom">Votre nom</label>
                <input type="text" id="nom" name="nom" autocomplete="name" required>
            </div>
            <div>
                <label for="email">Votre adresse e-mail (obligatoire)</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <div>
                    <label for="message">Votre message (obligatoire)</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
            </div>

            <button type="submit">Envoyer le message</button>
        </form>

    </main>
